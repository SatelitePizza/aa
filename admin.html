<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투표 관리자 마스터 페이지</title>
    <style>
        body { font-family: sans-serif; background-color: #222; color: white; text-align: center; padding: 50px; }
        #admin-panel { display: none; /* 처음엔 숨겨둠 */ }
        
        /* 버튼 공통 스타일 */
        .btn {
            color: white; border: none; padding: 20px 40px;
            font-size: 1.5rem; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px;
            display: block; margin-left: auto; margin-right: auto; width: 80%; max-width: 400px;
        }
        .warning-btn { background-color: #ff9900; } 
        .warning-btn:hover { background-color: #cc7a00; }
        .danger-btn { background-color: #ff4d4d; } 
        .danger-btn:hover { background-color: #cc0000; }
        
        /* 실시간 현황판 스타일 (점수 숨김) */
        .status-box { background-color: #333; padding: 30px; border-radius: 15px; margin: 30px auto; max-width: 500px; }
        .total-text { font-size: 1.5rem; color: white; font-weight: bold; }
        .blind-notice { font-size: 1rem; color: #ff9900; margin-top: 15px; opacity: 0.9; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <h1>🛠️ 투표 마스터 컨트롤</h1>
        
        <div class="status-box">
            <div class="total-text">현재 투표 진행 상황: <span id="current-total">0</span> / 7 표</div>
            <div class="blind-notice">🔒 공정한 참여를 위해 득표 현황은 블라인드 처리되었습니다.</div>
        </div>

        <button class="btn warning-btn" onclick="forceShowResult()">강제 결과 공개 (조기 종료)</button>

        <button class="btn danger-btn" onclick="forceReset()">전체 초기화 (강제 리셋)</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 관리자 비밀번호
        const ADMIN_PASSWORD = "1234";

        // 접속 시 비밀번호 확인
        const userInput = prompt("관리자 비밀번호를 입력하세요:");
        if (userInput === ADMIN_PASSWORD) {
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            alert("접근 권한이 없습니다.");
            window.location.href = "index.html"; 
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAXv0MNJ0d2wmhmdtNmjVi8zJddvRWtNmQ",
            authDomain: "test-1eccc.firebaseapp.com",
            databaseURL: "https://test-1eccc-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "test-1eccc",
            storageBucket: "test-1eccc.firebasestorage.app",
            messagingSenderId: "20655092545",
            appId: "1:20655092545:web:01e13a5a1e3bc404b2a7c0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const sessionRef = db.ref('votingSession');

        // 전체 투표수만 실시간 모니터링 (득표수는 무시)
        sessionRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('current-total').innerText = data.total;
            }
        });

        // 강제 결과 공개 (조기 종료)
        function forceShowResult() {
            if (confirm("아직 7표가 다 차지 않았습니다. 이대로 결과를 모든 사람에게 공개하시겠습니까?")) {
                sessionRef.update({ total: 7 });
                alert("결과 공개 완료! 모든 사용자의 화면이 결과창으로 넘어갑니다.");
            }
        }

        // 강제 리셋
        function forceReset() {
            if (confirm("정말로 모든 투표를 초기화하시겠습니까?")) {
                sessionRef.set({ votesA: 0, votesB: 0, total: 0, roundId: Date.now() });
                alert("초기화 완료! 모든 사용자의 화면이 첫 화면으로 돌아갔습니다.");
            }
        }
    </script>
</body>
</html>
        });
