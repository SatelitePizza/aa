<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>★경주★ 노래 월드컵</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100%; width: 100%; text-align: center; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 0. 로딩 화면 */
        #loading-screen { background-color: #222; color: white; font-size: 2rem; font-weight: bold; }

        /* 1. 투표 화면 */
        #vote-screen.active { flex-direction: row; }
        .vote-btn { flex: 1; height: 100%; border: none; font-size: 4rem; color: white; cursor: pointer; font-weight: bold; }
        #btn-a { background-color: #ff4d4d; } 
        #btn-b { background-color: #4da6ff; } 
        .vote-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 2. 대기 화면 */
        #waiting-screen { font-size: 2rem; color: white; transition: background-color 0.3s; }
        .wait-subtitle { font-size: 1.2rem; margin-top: 15px; opacity: 0.9; }
        #my-choice-display { font-size: 3.5rem; font-weight: bold; margin-bottom: 20px; }
        
        /* 취소 버튼 */
        .cancel-btn {
            margin-top: 40px;
            padding: 12px 24px;
            font-size: 1.2rem;
            color: #333;
            background-color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .cancel-btn:hover { background-color: #f0f0f0; }
        .cancel-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 3. 결과 화면 */
        #result-screen { color: white; cursor: pointer; }
        #result-text { font-size: 4rem; font-weight: bold; }
        .click-guide { font-size: 1rem; margin-top: 20px; opacity: 0.8; font-weight: normal; }
    </style>
</head>
<body>

    <div id="loading-screen" class="screen active">
        <div>상태 확인 중...</div>
    </div>

    <div id="vote-screen" class="screen">
        <button id="btn-a" class="vote-btn" onclick="castVote('A')">A</button>
        <button id="btn-b" class="vote-btn" onclick="castVote('B')">B</button>
    </div>

    <div id="waiting-screen" class="screen">
        <div id="my-choice-display">나의 선택: -</div>
        <div>
            대
