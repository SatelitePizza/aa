<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 A/B 투표</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100%; width: 100%; text-align: center; }
        .active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 투표 화면 */
        #vote-screen.active { flex-direction: row; }
        .vote-btn { flex: 1; height: 100%; border: none; font-size: 4rem; color: white; cursor: pointer; font-weight: bold; }
        #btn-a { background-color: #ff4d4d; } 
        #btn-b { background-color: #4da6ff; } 
        
        /* 대기 화면 */
        #waiting-screen { background-color: #f5f5f5; font-size: 2rem; color: #333; }
        
        /* 투표 취소 버튼 스타일 */
        .cancel-btn {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #666;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .cancel-btn:hover { background-color: #eee; }

        /* 결과 화면 */
        #result-screen { color: white; cursor: pointer; }
        #result-text { font-size: 4rem; font-weight: bold; }
        .click-guide { font-size: 1rem; margin-top: 20px; opacity: 0.8; font-weight: normal; }
    </style>
</head>
<body>

    <div id="vote-screen" class="screen active">
        <button id="btn-a" class="vote-btn" onclick="castVote('A')">A</button>
        <button id="btn-b" class="vote-btn" onclick="castVote('B')">B</button>
    </div>

    <div id="waiting-screen" class="screen">
        <div>
            대기중...<br>
            <span style="font-size: 1.2rem; color: #666;">(현재 <span id="vote-count">0</span> / 7 표)</span>
        </div>
        <button class="cancel-btn" onclick="cancelVote()">투표 취소</button>
    </div>

    <div id="result-screen" class="screen" onclick="resetToStart()">
        <div id="result-text"></div>
        <div class="click-guide">(화면을 터치하면 처음으로 돌아갑니다)</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 요청하신 Firebase 설정값 반영
        const firebaseConfig = {
            apiKey: "AIzaSyAXv0MNJ0d2wmhmdtNmjVi8zJddvRWtNmQ",
            authDomain: "test-1eccc.firebaseapp.com",
            databaseURL: "https://test-1eccc-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "test-1eccc",
            storageBucket: "test-1eccc.firebasestorage.app",
            messagingSenderId: "20655092545",
            appId: "1:20655092545:web:01e13a5a1e3bc404b2a7c0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const sessionRef = db.ref('votingSession');

        let currentRoundId = 0; 
        let hasVoted = false;   

        // 서버 데이터 실시간 감지
        sessionRef.on('value', (snapshot) => {
            let data = snapshot.val();
            
            if (!data) {
                data = { votesA: 0, votesB: 0, total: 0, roundId: 1 };
            }

            currentRoundId = data.roundId;

            const myVotedRound = localStorage.getItem('votedRound');
            if (myVotedRound == currentRoundId) {
                hasVoted = true;  
            } else {
                hasVoted = false; 
            }

            document.getElementById('vote-count').innerText = data.total;

            if (data.total >= 7) {
                showResult(data.votesA, data.votesB);
            } else {
                document.getElementById('result-screen').classList.remove('active');
                if (hasVoted) {
                    document.getElementById('vote-screen').classList.remove('active');
                    document.getElementById('waiting-screen').classList.add('active');
                } else {
                    document.getElementById('waiting-screen').classList.remove('active');
                    document.getElementById('vote-screen').classList.add('active');
                }
            }
        });

        // 투표하기 함수
        function castVote(choice) {
            if (hasVoted) return; 
            
            hasVoted = true;
            localStorage.setItem('votedRound', currentRoundId);
            localStorage.setItem('myChoice', choice); // 내가 무엇을 선택했는지 추가 저장

            sessionRef.transaction((currentData) => {
                if (currentData === null) {
                    currentData = { votesA: 0, votesB: 0, total: 0, roundId: Date.now() };
                }
                if (choice === 'A') currentData.votesA++;
                if (choice === 'B') currentData.votesB++;
                currentData.total++;
                
                return currentData;
            });
        }

        // 투표 취소 기능 추가
        function cancelVote() {
            if (!hasVoted) return;

            const myChoice = localStorage.getItem('myChoice'); // 아까 저장한 내 선택지 불러오기

            // 로컬(내 폰)의 투표 기록 삭제
            hasVoted = false;
            localStorage.removeItem('votedRound');
            localStorage.removeItem('myChoice');

            // 서버 데이터에서 내 표만 빼기 (트랜잭션)
            sessionRef.transaction((currentData) => {
                if (currentData === null) return currentData;
                
                // 표수가 0보다 클 때만 차감 (안전 장치)
                if (myChoice === 'A' && currentData.votesA > 0) currentData.votesA--;
                if (myChoice === 'B' && currentData.votesB > 0) currentData.votesB--;
                if (currentData.total > 0) currentData.total--;
                
                return currentData;
            });
        }

        // 결과 화면 처리
        function showResult(votesA, votesB) {
            document.getElementById('vote-screen').classList.remove('active');
            document.getElementById('waiting-screen').classList.remove('active');
            
            const resultScreen = document.getElementById('result-screen');
            const resultText = document.getElementById('result-text');
            
            resultScreen.classList.add('active');

            if (votesA > votesB) {
                resultText.innerText = "A 승리!";
                resultScreen.style.backgroundColor = "#ff4d4d"; 
            } else if (votesB > votesA) {
                resultText.innerText = "B 승리!";
                resultScreen.style.backgroundColor = "#4da6ff"; 
            } else {
                resultText.innerText = "무승부";
                resultScreen.style.backgroundColor = "#999999"; 
            }
        }

        // 화면 초기화
        function resetToStart() {
            sessionRef.set({ votesA: 0, votesB: 0, total: 0, roundId: Date.now() });
        }
    </script>
</body>
</html>
